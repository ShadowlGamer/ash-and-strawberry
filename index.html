<!DOCTYPE html>
<html lang="en" data-theme="ember">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ash and strawberry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css?v=16">
</head>
<body>
<canvas id="ash"></canvas>
<div class="vignette"></div>

<div id="onboarding" class="onboarding" aria-hidden="true">
  <div class="onboarding-card">
    <div class="onboarding-head">
      <div class="onboarding-eyebrow">ash and strawberry</div>
      <h1 class="onboarding-title" data-i18n="onboardingTitle">customize your reading</h1>
      <p class="onboarding-sub" data-i18n="onboardingSub">choose a palette, a soundtrack, and a volume. you can change these any time.</p>
    </div>

    <section class="onboarding-block">
      <div class="block-label" data-i18n="chooseTheme">palette</div>
      <div id="palette-grid" class="palette-grid"></div>
    </section>

    <section class="onboarding-block">
      <div class="block-label" data-i18n="chooseMusic">music</div>
      <div class="music-grid">
        <button type="button" class="music-opt" data-music="chapter">
          <span class="music-opt-dot"></span>
          <span class="music-opt-title" data-i18n="musicChapterT">by chapter</span>
          <span class="music-opt-desc" data-i18n="musicChapterD">a recommended song opens on each chapter that has one</span>
        </button>
        <button type="button" class="music-opt" data-music="ambient">
          <span class="music-opt-dot"></span>
          <span class="music-opt-title" data-i18n="musicAmbientT">ambient</span>
          <span class="music-opt-desc" data-i18n="musicAmbientD">one calm track plays softly the whole way through</span>
        </button>
      </div>
    </section>

    <section class="onboarding-block">
      <div class="block-label">
        <span data-i18n="volumeLabel">volume</span>
        <span id="volume-readout" class="volume-readout">60</span>
      </div>
      <input type="range" id="onboard-volume" class="volume-slider" min="0" max="100" value="60">
    </section>

    <button type="button" id="onboard-begin" class="onboard-begin" data-i18n="begin">begin</button>
  </div>
</div>

<header class="topbar">
  <button id="toc-toggle" aria-label="contents" class="icon-btn">☰</button>
  <div class="topbar-title">ash and strawberry</div>
  <div class="topbar-spacer"></div>

  <div class="lang-switch">
    <button data-lang="en" class="lang-btn active">en</button>
    <button data-lang="ru" class="lang-btn">ru</button>
  </div>

  <button id="chars-toggle" class="text-btn" aria-label="characters">
    <span class="btn-text" data-i18n="characters">characters</span>
    <span class="btn-icon" aria-hidden="true">◉</span>
  </button>

  <button id="gallery-toggle" class="text-btn" aria-label="gallery">
    <span class="btn-text" data-i18n="gallery">gallery</span>
    <span class="btn-icon" aria-hidden="true">▦</span>
  </button>

  <a href="https://boosty.to/drawmunasty/donate"
     target="_blank"
     rel="noopener noreferrer"
     class="text-btn support-btn"
     aria-label="support">
    <span class="btn-text" data-i18n="support">support</span>
    <span class="btn-icon" aria-hidden="true">♥</span>
  </a>

  <button id="customize-toggle" class="icon-btn" aria-label="customize" title="customize">
    <span aria-hidden="true">✦</span>
  </button>

  <button id="settings-toggle" class="text-btn" aria-label="control">
    <span class="btn-text" data-i18n="controlBtn">control</span>
    <span class="btn-icon" aria-hidden="true">⚙</span>
  </button>
</header>

<div class="progress"><div id="progress-bar"></div></div>

<aside id="toc" class="toc">
  <div class="panel-header">
    <span data-i18n="contents">contents</span>
    <button id="toc-close" class="panel-close">×</button>
  </div>
  <nav id="toc-list" class="toc-list"></nav>
</aside>

<aside id="chars" class="chars">
  <div class="panel-header">
    <span data-i18n="characters">characters</span>
    <button id="chars-close" class="panel-close">×</button>
  </div>
  <ul class="char-list" id="chars-list"></ul>
</aside>

<div id="gallery-modal" class="gallery-modal">
  <div class="gallery-inner">
    <div class="gallery-header">
      <span data-i18n="gallery">gallery</span>
      <button id="gallery-close" class="panel-close">×</button>
    </div>
    <div class="gallery-stage">
      <button id="gallery-prev" class="gallery-nav" aria-label="previous">←</button>
      <div class="gallery-frame" id="gallery-frame">
        <img id="gallery-img" src="" alt="">
        <div id="gallery-fallback" class="gallery-fallback"></div>
      </div>
      <button id="gallery-next" class="gallery-nav" aria-label="next">→</button>
    </div>
    <div class="gallery-footer">
      <div id="gallery-name" class="gallery-name"></div>
      <div id="gallery-counter" class="gallery-counter"></div>
    </div>
  </div>
</div>

<div id="overlay" class="overlay"></div>

<main id="reader" class="reader">
  <div class="chapter-label" id="chapter-label"></div>
  <div id="song-row" class="song-row"></div>
  <article id="page" class="page"></article>
</main>

<div class="edge-zone edge-left"  id="edge-left"  aria-hidden="true"></div>
<div class="edge-zone edge-right" id="edge-right" aria-hidden="true"></div>

<button id="arrow-prev" class="arrow-btn arrow-prev" aria-label="previous">‹</button>
<button id="arrow-next" class="arrow-btn arrow-next" aria-label="next">›</button>

<nav class="pager">
  <div class="pager-inner">
    <button id="prev" class="pager-btn" data-i18n="previous">← previous</button>
    <span id="counter" class="counter"></span>
    <button id="next" class="pager-btn" data-i18n="next">next →</button>
  </div>
</nav>

<div id="settings" class="settings">
  <div class="settings-section">
    <div class="settings-section-label" data-i18n="musicLabel">music</div>
    <div class="settings-mode-row">
      <button type="button" class="mode-btn" data-mode="chapter" data-i18n="musicChapterT">by chapter</button>
      <button type="button" class="mode-btn" data-mode="ambient" data-i18n="musicAmbientT">ambient</button>
    </div>
    <button type="button" id="music-playpause" class="music-playpause">
      <span id="music-playpause-icon">▶</span>
      <span id="music-playpause-label" data-i18n="playMusic">play music</span>
    </button>
  </div>

  <label><span data-i18n="volumeLabel">volume</span>
    <input type="range" id="settings-volume" min="0" max="100" value="60">
  </label>

  <label><span data-i18n="fontSize">font size</span>
    <input type="range" id="font-size" min="14" max="24" value="19">
  </label>

  <label><span data-i18n="fallingAsh">falling ash</span>
    <input type="checkbox" id="ash-toggle" checked>
  </label>

  <button type="button" id="settings-customize" class="settings-wide-btn" data-i18n="reopenCustomize">customize again</button>
</div>

<audio id="bg-audio" preload="auto"></audio>
<audio id="ambient-audio" preload="auto" loop></audio>

<script src="js/characters.js"></script>
<script src="js/songs.js"></script>

<script src="js/story/00-prologue.js"></script>
<script src="js/story/01-chapter1.js"></script>
<script src="js/story/02-chapter2.js"></script>
<script src="js/story/03-chapter3.js"></script>
<script src="js/story/04-chapter3-5.js"></script>
<script src="js/story/05-chapter4.js"></script>
<script src="js/story/06-chapter5.js"></script>
<script src="js/story/07-chapter6.js"></script>
<script src="js/story/08-chapter7.js"></script>
<script src="js/story/09-chapter8.js"></script>
<script src="js/story/10-chapter9.js"></script>
<script src="js/story/11-chapter10.js"></script>
<script src="js/story/12-chapter11.js"></script>
<script src="js/story/13-chapter12.js"></script>
<script src="js/story/14-chapter13.js"></script>
<script src="js/story/15-chapter14.js"></script>
<script src="js/story/16-chapter15.js"></script>

<script src="js/story/ru/00-prologue.js"></script>
<script src="js/story/ru/01-chapter1.js"></script>
<script src="js/story/ru/02-chapter2.js"></script>
<script src="js/story/ru/03-chapter3.js"></script>
<script src="js/story/ru/04-chapter3-5.js"></script>
<script src="js/story/ru/05-chapter4.js"></script>
<script src="js/story/ru/06-chapter5.js"></script>
<script src="js/story/ru/07-chapter6.js"></script>
<script src="js/story/ru/08-chapter7.js"></script>
<script src="js/story/ru/09-chapter8.js"></script>
<script src="js/story/ru/10-chapter9.js"></script>
<script src="js/story/ru/11-chapter10.js"></script>
<script src="js/story/ru/12-chapter11.js"></script>
<script src="js/story/ru/13-chapter12.js"></script>
<script src="js/story/ru/14-chapter13.js"></script>
<script src="js/story/ru/15-chapter14.js"></script>
<script src="js/story/ru/16-chapter15.js"></script>

<script src="js/app.js?v=6"></script>
</body>
</html>
